name: octopus-tickets-test

x-tickets-build: &tickets_build
  context: ..
  dockerfile: tickets_test/service/Dockerfile
  secrets:
    - host_ca

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octopus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tickets]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [tickets]

  tickets-migrate:
    build: *tickets_build
    command: ["python", "-m", "service.migrate"]
    environment: &tickets_environment
      TICKETS_DATABASE_URL: postgresql://octopus:${POSTGRES_PASSWORD}@postgres:5432/tickets
      TICKETS_WEBHOOK_TOKEN: ${TICKETS_WEBHOOK_TOKEN}
      TICKETS_OBJECT_STORE_PATH: /objects
      TICKETS_ACCOUNTS_PATH: /run/config/tickets.accounts.json
      TICKETS_ACCEPT_ALL_TEST_GROUPS: ${TICKETS_ACCEPT_ALL_TEST_GROUPS:-false}
      TICKETS_ALLOWED_GROUP_IDS: ${TICKETS_ALLOWED_GROUP_IDS:-}
      TICKETS_GROUP_NAMES: ${TICKETS_GROUP_NAMES:-}
      TICKETS_EXPORT_DIR: /exports
      TICKETS_GMAIL_CREDENTIALS_PATH: /run/gmail/credentials.json
      TICKETS_GMAIL_TOKEN_PATH: /run/gmail/token.json
      TICKETS_GMAIL_ATTACHMENT_ROOT: /mail-packages
      TICKETS_GMAIL_ALLOWED_RECIPIENTS: ${TICKETS_GMAIL_ALLOWED_RECIPIENTS:-oficinaoctopus13@gmail.com}
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes: &tickets_volumes
      - ../jarvis/config/tickets.accounts.local.json:/run/config/tickets.accounts.json:ro
      - ./runtime/exports:/exports
      - ./runtime/gmail:/run/gmail
      - ./runtime/packages:/mail-packages:ro
      - ticket_objects:/objects
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tickets]

  tickets-api:
    build: *tickets_build
    restart: unless-stopped
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *tickets_environment
    volumes: *tickets_volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      tickets-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tickets]

  tickets-worker:
    build: *tickets_build
    restart: unless-stopped
    command: ["python", "-m", "service.worker"]
    environment: *tickets_environment
    volumes: *tickets_volumes
    depends_on:
      tickets-api:
        condition: service_healthy
    networks: [tickets]

  tickets-mailer:
    profiles: [gmail]
    build: *tickets_build
    command: ["python", "-m", "service.gmail_cli", "--help"]
    environment: *tickets_environment
    volumes: *tickets_volumes
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      tickets-migrate:
        condition: service_completed_successfully
    networks: [tickets]

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_NAME: octopus-tickets-test
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      TELEMETRY_ENABLED: "false"
      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "false"
      LOG_LEVEL: ERROR,WARN,INFO,WEBHOOKS
      LOG_COLOR: "false"
      LOG_BAILEYS: warn
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://octopus:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: octopus_tickets_test
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_DELETE_MESSAGE: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: octopus-tickets-test
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      CONFIG_SESSION_PHONE_CLIENT: OCTOPUS TEST
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 60
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_REQUEST_TIMEOUT_MS: 60000
      WEBHOOK_RETRY_MAX_ATTEMPTS: 100
      WEBHOOK_RETRY_INITIAL_DELAY_SECONDS: 5
      WEBHOOK_RETRY_USE_EXPONENTIAL_BACKOFF: "true"
      WEBHOOK_RETRY_MAX_DELAY_SECONDS: 300
      WEBHOOK_RETRY_JITTER_FACTOR: 0.2
      LANGUAGE: es
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tickets-api:
        condition: service_healthy
    networks: [tickets]

networks:
  tickets:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ticket_objects:
  evolution_instances:

secrets:
  host_ca:
    file: ${TICKETS_HOST_CA_FILE:-./runtime/certs/host-proxy-ca.crt}
